; Réglages PHP de production pour RETISS

memory_limit = 256M
max_execution_time = 120

; Photos des vêtements (5 Mo max côté Laravel) et formulaires avec plusieurs fichiers
upload_max_filesize = 12M
post_max_size = 16M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = Africa/Tunis

; OPcache : le code ne change pas dans une image, inutile de revérifier les fichiers
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
