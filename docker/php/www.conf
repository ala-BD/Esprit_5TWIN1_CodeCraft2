; Pool PHP-FPM de RETISS (complète la configuration www par défaut de l'image)
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Santé et statistiques du pool (healthcheck Docker et supervision)
ping.path = /ping
pm.status_path = /fpm-status

; Les journaux des workers remontent dans « docker compose logs »
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
