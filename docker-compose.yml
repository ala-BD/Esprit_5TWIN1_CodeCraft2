# RETISS — environnement complet en conteneurs
#
#   docker compose up -d --build                 application : http://localhost:8088
#   docker compose --profile monitoring up -d    + Prometheus (9090) et Grafana (3000)
#   docker compose logs -f app                   journaux de Laravel
#   docker compose down                          arrêt (les données restent dans les volumes)
#
# Les secrets (APP_KEY, GEMINI_API_KEY) sont lus dans le fichier .env local, jamais versionné.

name: retiss

x-laravel-env: &laravel-env
  APP_NAME: RETISS
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY manquante dans .env (php artisan key:generate --show)}
  APP_URL: ${RETISS_URL:-http://localhost:8088}
  APP_LOCALE: fr
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${RETISS_LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: textilecycle
  DB_USERNAME: retiss
  DB_PASSWORD: ${RETISS_DB_PASSWORD:-retiss}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: no-reply@retiss.tn
  MAIL_FROM_NAME: RETISS
  # M3 Upcycling (Gemini)
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
  # M4 Recyclage : micro-service IA du docker-compose
  AI_RECYCLAGE_URL: http://ai:8001
  # M2 Marketplace : paiement Stripe (clés de test) et IA d'estimation
  STRIPE_KEY: ${STRIPE_KEY:-}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gemini-3.5-flash}
  # M1 Collecte : détourage des photos via ComfyUI lancé sur la machine hôte
  DONATION_IMAGE_PROVIDER: ${DONATION_IMAGE_PROVIDER:-comfyui}
  COMFYUI_URL: ${DOCKER_COMFYUI_URL:-http://host.docker.internal:8188}
  # M5 : assistant vocal (Groq)
  ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
  # Supervision
  METRICS_TOKEN: ${METRICS_TOKEN:-retiss-metrics}

services:

  # --- Application Laravel (PHP-FPM) : migrations au démarrage ---
  app:
    build:
      context: .
      target: app
    image: ${RETISS_IMAGE_PREFIX:-retiss}-app:${RETISS_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *laravel-env
      SEED_DEMO: ${SEED_DEMO:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"    # ComfyUI (M1) lancé sur la machine hôte
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  # --- Serveur web : seul point d'entrée exposé ---
  web:
    build:
      context: .
      target: web
    image: ${RETISS_IMAGE_PREFIX:-retiss}-web:${RETISS_TAG:-local}
    restart: unless-stopped
    ports:
      - "${RETISS_PORT:-8088}:80"
    volumes:
      - uploads:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_healthy

  # --- File de tâches Laravel (jobs en base de données) ---
  queue:
    build:
      context: .
      target: app
    image: ${RETISS_IMAGE_PREFIX:-retiss}-app:${RETISS_TAG:-local}
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment: *laravel-env
    volumes:
      - uploads:/var/www/html/storage/app/public
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # --- Base de données ---
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: textilecycle
      MYSQL_USER: retiss
      MYSQL_PASSWORD: ${RETISS_DB_PASSWORD:-retiss}
      MYSQL_ROOT_PASSWORD: ${RETISS_DB_ROOT_PASSWORD:-retiss-root}
      TZ: Africa/Tunis
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${RETISS_DB_PORT:-3307}:3306"          # accès depuis l'hôte (HeidiSQL, DBeaver…)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # --- IA filière du module M4 (FastAPI), joignable seulement par Laravel ---
  ai:
    build: ./ai-recyclage
    image: ${RETISS_IMAGE_PREFIX:-retiss}-ai:${RETISS_TAG:-local}
    restart: unless-stopped

  # --- Boîte mail de test : e-mails de vérification et de mot de passe oublié ---
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${RETISS_MAIL_PORT:-8026}:8025"

  # ============ Supervision (profil « monitoring ») ============

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./devops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/monitoring/alertes.yml:/etc/prometheus/alertes.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${RETISS_PROMETHEUS_PORT:-9090}:9090"
    depends_on: [web]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-retiss}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/retiss.json
    volumes:
      - ./devops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./devops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${RETISS_GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${RETISS_DB_ROOT_PASSWORD:-retiss-root}
    depends_on:
      db:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://web/nginx-status"]
    depends_on: [web]

volumes:
  mysql-data:
  uploads:
  prometheus-data:
  grafana-data:
