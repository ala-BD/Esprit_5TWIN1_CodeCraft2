# RETISS — pipeline d'intégration et de livraison continues
#
#   CI : qualité du code -> tests Laravel + tests IA -> images Docker -> tests de fumée -> scan de sécurité
#   CD : publication des images sur GHCR (branches main / integration)
#        puis déploiement sur Railway, si RAILWAY_ENABLED et le secret RAILWAY_TOKEN sont configurés
#
# Les secrets ne sont jamais dans le dépôt : la CI génère une APP_KEY jetable,
# la production garde ses variables dans Railway.

name: CI/CD

on:
  push:
    branches: [main, integration, ala, devops]
  pull_request:
    branches: [main, integration, ala]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  PYTHON_VERSION: "3.12"

jobs:

  # ---------------------------------------------------------------- CI 1
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntaxe PHP
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Style (Pint) des fichiers PHP modifiés
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="HEAD~1"
          fi
          fichiers=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.php' | grep -v '^storage/\|^bootstrap/cache/' || true)
          if [ -z "$fichiers" ]; then
            echo "Aucun fichier PHP modifié."
            exit 0
          fi
          echo "$fichiers"
          echo "$fichiers" | xargs vendor/bin/pint --test

      - name: Style (Pint) du projet entier — informatif
        run: |
          if ! vendor/bin/pint --test > pint.log 2>&1; then
            echo "::warning::Pint : des fichiers existants ne respectent pas le style (non bloquant, liste dans le journal)"
            cat pint.log
          fi

      - name: Audit des dépendances
        run: composer audit --no-interaction || echo "::warning::composer audit signale des vulnérabilités (voir le journal)"

  # ---------------------------------------------------------------- CI 2
  tests-laravel:
    name: Tests Laravel
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, gd, zip, intl, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit (SQLite en mémoire)
        run: php artisan test --log-junit storage/logs/junit.xml

      - name: Rapport JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-laravel
          path: storage/logs/junit.xml
          if-no-files-found: ignore

  tests-ia:
    name: Tests IA recyclage (Python)
    runs-on: ubuntu-latest
    needs: qualite
    defaults:
      run:
        working-directory: ai-recyclage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-recyclage/requirements.txt

      - run: pip install -r requirements.txt
      - name: Entraînement du modèle
        run: python -c "import entrainement; entrainement.entrainer()"
      - name: Tests unitaires
        run: python -m unittest test_moteur -v

  # ---------------------------------------------------------------- CI 3
  docker:
    name: Images Docker + tests de fumée
    runs-on: ubuntu-latest
    needs: [tests-laravel, tests-ia]
    permissions:
      contents: read
      packages: write
    env:
      RETISS_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Nom des images (GHCR exige des minuscules)
        run: echo "RETISS_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}/retiss" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Construire l'image app (PHP-FPM)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          load: true
          tags: ${{ env.RETISS_IMAGE_PREFIX }}-app:${{ env.RETISS_TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Construire l'image web (Nginx)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: ${{ env.RETISS_IMAGE_PREFIX }}-web:${{ env.RETISS_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Construire l'image ai (FastAPI, modèle entraîné et testé au build)
        uses: docker/build-push-action@v7
        with:
          context: ai-recyclage
          load: true
          tags: ${{ env.RETISS_IMAGE_PREFIX }}-ai:${{ env.RETISS_TAG }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

      - name: Clé d'application jetable (pour toutes les étapes suivantes)
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$APP_KEY"
          echo "APP_KEY=$APP_KEY" >> "$GITHUB_ENV"

      - name: Démarrer la pile complète
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Tests de fumée
        run: bash devops/ci/smoke.sh http://localhost:8088

      - name: Journaux des conteneurs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RETISS_IMAGE_PREFIX }}-app:${{ env.RETISS_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

      # ------------------------------------------------------------ CD 1
      - name: Connexion à GHCR
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'integration')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les images (sha + nom de branche)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'integration')
        run: |
          for image in app web ai; do
            source="$RETISS_IMAGE_PREFIX-$image:$RETISS_TAG"
            docker tag "$source" "$RETISS_IMAGE_PREFIX-$image:${GITHUB_REF_NAME}"
            docker push "$source"
            docker push "$RETISS_IMAGE_PREFIX-$image:${GITHUB_REF_NAME}"
          done

  # ---------------------------------------------------------------- CD 2
  # Déploiement sur Railway (projet « retiss », environnement production) après une CI verte.
  # Activation : variable RAILWAY_ENABLED=true et secret RAILWAY_TOKEN (jeton de projet Railway).
  # Retour arrière : redéployer une version précédente depuis l'onglet Deployments de Railway.
  deploiement:
    name: Déploiement Railway
    runs-on: ubuntu-latest
    needs: docker
    if: >-
      github.event_name == 'push'
      && (github.ref_name == 'main' || github.ref_name == 'integration')
      && vars.RAILWAY_ENABLED == 'true'
    concurrency:
      group: deploiement-railway
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.RAILWAY_URL || 'https://retiss-production.up.railway.app' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_CLI_VERSION: "5.71.0"
      URL: ${{ vars.RAILWAY_URL || 'https://retiss-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@v7

      - name: CLI Railway (version figée)
        run: |
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"
          railway --version

      - name: Déployer le service IA (réseau privé)
        run: railway up ai-recyclage --path-as-root --service ai --ci

      - name: Déployer l'application (image docker/railway)
        run: railway up --service retiss --ci

      - name: Vérification après déploiement
        run: |
          for chemin in /nginx-health /login; do
            curl -fsS -o /dev/null --retry 10 --retry-delay 10 --retry-all-errors "$URL$chemin"
            echo "GET $chemin OK"
          done
